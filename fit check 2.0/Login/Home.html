<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Fashion Wardrobe</title>
    <link rel="stylesheet" href="style.css">
    <style>
      
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1; 
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%;
            overflow: auto; 
            background-color: rgb(0,0,0); 
            background-color: rgba(0,0,0,0.4); 
            padding-top: 60px;
        }
        
        .modal-content {
            background-color: #fefefe;
            margin: 5% auto; 
            padding: 20px;
            border: 1px solid #888;
            width: 300px; 
            text-align: center;
            border-radius: 10px;
        }

        .modal button {
            margin: 5px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-icon">
            <img src="images/icon.png" alt="Icon" class="icon">
        </div>
        <nav class="menu"> 
            <a href="#" class="menu-item">Wardrobe</a>
            <div class="upload-button">
                <label for="upload-input">
                    <img src="images/upload_icon.png" alt="Upload" class="upload-png">
                </label>
                <input type="file" id="upload-input" style="display: none;" accept="image/*" />
            </div>
            <a href="#" class="menu-item">Fits</a>
        </nav>
    </div>

    <div class="container">
        <div class="content">
            <div class="image-grid" id="imageGrid">
                <div class="image-item">
                    <img src="images/Image1.jpg" alt="Item 1">
                    <div class="caption">Hat - Brown</div>
                </div>
                <div class="image-item">
                    <img src="images/Image2.jpg" alt="Item 2">
                    <div class="caption">Jacket - Green</div>
                </div>
                <div class="image-item">
                    <img src="images/Image3.jpg" alt="Item 3">
                    <div class="caption">T-shirt - Green</div>
                </div>
            </div>

            <div class="upload-image" onclick="openModal()">
                <label for="upload-right">
                    <img src="images/upload_image.png" alt="Upload" class="upload-icon">
                </label>
                <input type="file" id="upload-right" style="display: none;" accept="image/*" onchange="handleFileSelect(event)">
            </div>
        </div>
    </div>


    <div id="confirmationModal" class="modal">
        <div class="modal-content">
            <p>Are you sure you want to upload this image?</p>
            <button id="confirmButton">Confirm</button>
            <button onclick="closeModal()">Deny</button>
        </div>
    </div>

    <script>
        let selectedFile = null; 

        
        function openModal() {
            const fileInput = document.getElementById('upload-right');
            fileInput.click(); 
        }

      
        function handleFileSelect(event) {
            selectedFile = event.target.files[0]; 
            const modal = document.getElementById('confirmationModal');
            modal.style.display = "block"; 
        }

       
        document.getElementById('confirmButton').addEventListener('click', function() {
            if (selectedFile) {
                uploadImage(selectedFile); 
            }
            closeModal(); 
        });

        
        function closeModal() {
            const modal = document.getElementById('confirmationModal');
            modal.style.display = "none"; 
        }

        function uploadImage(file) {
            const formData = new FormData();
            formData.append("image_file", file);

            fetch('https://api.remove.bg/v1.0/removebg', {
                method: 'POST',
                headers: {
                    'X-Api-Key': 'atnjeNopQK7kdNqyYQadSF3Z', 
                },
                body: formData
            })
            .then(response => response.blob())
            .then(blob => {
                const imageUrl = URL.createObjectURL(blob);
                addImageToGrid(imageUrl); 
            })
            .catch(error => console.error('Error:', error));
        }

        function addImageToGrid(imageUrl) {
            const imageGrid = document.getElementById('imageGrid');

         
            const newImageItem = document.createElement('div');
            newImageItem.classList.add('image-item');

            const imgElement = document.createElement('img');
            imgElement.src = imageUrl; 
            const caption = document.createElement('div');
            caption.className = 'caption';
            caption.textContent = 'Uploaded Item';

          
            newImageItem.appendChild(imgElement);
            newImageItem.appendChild(caption);
            imageGrid.appendChild(newImageItem);
        }
    </script>
</body>
</html>
